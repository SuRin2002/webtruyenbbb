<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruyệnHay Premium Reader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.25s ease-out forwards',
                        'pop-in': 'popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-in': 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        popIn: { '0%': { transform: 'scale(0.92)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } },
                        slideIn: { '0%': { transform: 'translateX(100%)', opacity: 0 }, '100%': { transform: 'translateX(0)', opacity: 1 } }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style id="custom-theme-styles">
        body { font-family: 'Inter', sans-serif; }
        .font-lora { font-family: 'Lora', serif !important; }
        .font-merriweather { font-family: 'Merriweather', serif !important; }
        .font-inter { font-family: 'Inter', sans-serif !important; }
        .font-mono { font-family: 'Roboto Mono', monospace !important; }
        
        .reader-theme-light { background-color: #ffffff !important; color: #1f2937 !important; }
        .reader-theme-sepia { background-color: #fbf0d9 !important; color: #432818 !important; }
        .reader-theme-charcoal { background-color: #262a33 !important; color: #e5e7eb !important; }
        .reader-theme-dark { background-color: #0d1117 !important; color: #d1d5db !important; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body id="app-body" class="bg-gray-950 text-gray-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white transition-colors">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- NAVBAR -->
    <header class="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-md border-b border-gray-800/80 shadow-xl transition-all">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="router('home')">
                <div id="nav-logo-box" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-xl shadow-lg shadow-blue-500/20 group-hover:scale-105 transition duration-300">
                    📖
                </div>
                <span id="nav-title" class="text-xl font-extrabold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">TruyệnHay</span>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md relative hidden sm:block">
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Tìm kiếm truyện, tác giả..." class="w-full bg-gray-950/80 border border-gray-800 rounded-xl px-4 py-2 pl-10 text-sm text-gray-200 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                <span class="absolute left-3.5 top-2.5 text-gray-400 text-sm">🔍</span>
            </div>

            <!-- Nav Buttons -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <button onclick="router('home')" class="px-3 py-2 rounded-xl hover:bg-gray-800 text-xs sm:text-sm font-medium transition text-gray-300 hover:text-white">Trang Chủ</button>
                <button onclick="router('library')" class="px-3 py-2 rounded-xl hover:bg-gray-800 text-xs sm:text-sm font-medium transition text-gray-300 hover:text-white">Tủ Sách</button>
                <button onclick="router('upload')" class="px-3.5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-lg shadow-blue-600/25 transition active:scale-95 flex items-center gap-1">
                    <span>➕</span> <span class="hidden sm:inline">Đăng Truyện</span>
                </button>
                <button onclick="handleAdminNavClick()" id="nav-admin-btn" class="p-2 rounded-xl hover:bg-gray-800 text-gray-400 hover:text-white transition relative" title="Quản trị">
                    ⚙️
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 animate-fade-in" id="app-viewport"></main>

    <!-- CUSTOM MODAL CONFIRMATION -->
    <div id="custom-modal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl animate-pop-in space-y-4">
            <h3 id="modal-title" class="text-lg font-bold text-gray-100">Xác nhận</h3>
            <p id="modal-msg" class="text-sm text-gray-400 leading-relaxed"></p>
            <div class="flex justify-end gap-3 pt-2">
                <button id="modal-cancel-btn" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-300 transition">Hủy</button>
                <button id="modal-confirm-btn" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-xs font-semibold text-white shadow-lg transition">Đồng ý</button>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM TRUYỆN VÀO DANH SÁCH ĐỌC -->
    <div id="add-to-list-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl animate-pop-in space-y-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="text-base font-bold text-blue-400 flex items-center gap-2">📚 Lưu Vào Danh Sách Đọc</h3>
                <button onclick="closeAddToListModal()" class="text-gray-400 hover:text-white font-bold text-lg">×</button>
            </div>
            
            <div id="user-lists-container" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>

            <div class="border-t border-gray-800 pt-3 flex items-center gap-2">
                <input type="text" id="modal-new-list-input" placeholder="Thêm danh sách đọc mới..." class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-blue-500 flex-1">
                <button onclick="handleCreateNewListFromModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs shadow-lg shadow-blue-600/30 transition">
                    +
                </button>
            </div>
        </div>
    </div>

    <!-- ADMIN LOGIN MODAL -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-xs w-full p-6 shadow-2xl animate-pop-in space-y-4 text-center">
            <div class="w-12 h-12 rounded-2xl bg-blue-600/20 border border-blue-500/30 text-blue-400 text-2xl flex items-center justify-center mx-auto">🔐</div>
            <div>
                <h3 class="text-base font-bold text-gray-100">Xác Thực Quản Trị Viên</h3>
                <p class="text-xs text-gray-400 mt-1">Nhập PIN Admin để quản lý hệ thống (Mặc định: 1234)</p>
            </div>
            <input type="password" id="admin-pin-input" maxlength="6" placeholder="Nhập PIN..." class="w-full text-center tracking-widest text-lg font-bold bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 focus:border-blue-500 focus:outline-none">
            <div class="flex gap-2">
                <button onclick="closeAdminLoginModal()" class="flex-1 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-300">Hủy</button>
                <button onclick="submitAdminLogin()" class="flex-1 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white shadow-lg shadow-blue-600/30">Mở Khóa</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM ADD CHAPTER MODAL -->
    <div id="add-chapter-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl animate-pop-in space-y-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="text-base font-bold text-blue-400">➕ Thêm Chương Mới</h3>
                <button onclick="closeAddChapterModal()" class="text-gray-400 hover:text-white font-bold text-lg">×</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1 text-gray-300">Tiêu đề chương *</label>
                    <input type="text" id="modal-ch-title" placeholder="VD: Chương 3: Trận chiến bắt đầu" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2 text-xs focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1 text-gray-300">Nội dung chương *</label>
                    <textarea id="modal-ch-content" rows="6" placeholder="Nhập nội dung chương truyện..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2 text-xs focus:border-blue-500 focus:outline-none"></textarea>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeAddChapterModal()" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-300 transition">Hủy</button>
                <button id="save-chapter-btn" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white shadow-lg shadow-blue-600/30 transition">Lưu Chương</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="border-t border-gray-900 bg-gray-950/80 py-6 text-center text-xs text-gray-500">
        <p>© 2026 TruyệnHay Premium Reader. Đọc offline & Quản lý truyện thông minh[cite: 1].</p>
    </footer>

    <script>
        const DB_NAME = 'FreeWebNovelDB';
        const DB_VERSION = 1;
        const ADMIN_PIN_CORRECT = '1234';
        let db;

        let isAdminLoggedIn = false;
        let activeLibraryFolder = 'Tất cả';
        let targetStoryForAddList = null;

        const INITIAL_STORIES_DATA = [
            {
                id: 'sample-1',
                title: 'Toàn Trí Độc Giả',
                author: 'Sing N Song',
                description: 'Bộ truyện thử nghiệm giao diện với đầy đủ tính năng đọc offline, tùy chỉnh giao diện và quản lý chương nâng cao.',
                cover: 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400&q=80',
                categories: ['Huyền Huyễn', 'Hệ Thống'],
                tags: ['Action', 'Survival'],
                isDeleted: false,
                chapters: [
                    { title: 'Chương 1: Mở đầu câu chuyện', content: 'Đây là nội dung chương 1 thử nghiệm.\n\nBạn có thể tự do chỉnh đổi font chữ, màu nền và kích thước chữ trên thanh công cụ phía trên!' },
                    { title: 'Chương 2: Thế giới thay đổi', content: 'Nội dung chương 2. Sử dụng thanh Mục Lục xổ xuống để di chuyển giữa các chương nhanh chóng.' }
                ]
            }
        ];

        let appSettings = JSON.parse(localStorage.getItem('app_admin_settings') || JSON.stringify({
            siteTitle: 'TruyệnHay',
            heroHeading: 'Đọc Truyện Offline Không Giới Hạn[cite: 1]',
            heroSub: 'Tải dữ liệu, tự do đăng truyện và tùy chỉnh giao diện đọc sách theo sở thích cá nhân.',
            primaryFont: 'font-inter'
        }));

        let appState = {
            currentView: 'home',
            selectedStoryId: null,
            selectedChapterIndex: 0,
            searchQuery: '',
            selectedCategory: 'Tất cả',
            readerFont: 'font-inter',
            readerSize: 18,
            readerTheme: 'reader-theme-dark',
            uploadChapterCount: 1
        };

        const DEFAULT_CATEGORIES = ['Tiên Hiệp', 'Huyền Huyễn', 'Đô Thị', 'Ngôn Tình', 'Kiếm Hiệp', 'Xuyên Không', 'Trọng Sinh', 'Hệ Thống'];

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "pointer-events-auto flex items-center gap-2 px-4 py-3 bg-gray-900 border border-gray-700/80 rounded-2xl shadow-2xl text-xs font-semibold text-gray-100 animate-slide-in backdrop-blur-md";
            toast.innerHTML = `<span>${type === 'success' ? '✨' : 'ℹ️'}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleAdminNavClick() {
            if (isAdminLoggedIn) {
                router('admin');
            } else {
                document.getElementById('admin-login-modal').classList.remove('hidden');
                document.getElementById('admin-pin-input').value = '';
                document.getElementById('admin-pin-input').focus();
            }
        }

        function closeAdminLoginModal() {
            document.getElementById('admin-login-modal').classList.add('hidden');
        }

        function submitAdminLogin() {
            const pin = document.getElementById('admin-pin-input').value.trim();
            if (pin === ADMIN_PIN_CORRECT) {
                isAdminLoggedIn = true;
                closeAdminLoginModal();
                showToast("Đã đăng nhập quyền Admin!");
                router('admin');
            } else {
                showToast("Mã PIN không chính xác!", "info");
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            showToast("Đã thoát quyền Admin.");
            router('home');
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains('stories')) db.createObjectStore('stories', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('categories')) db.createObjectStore('categories', { keyPath: 'name' });
                };
                req.onsuccess = (e) => { db = e.target.result; seedInitialData().then(resolve); };
                req.onerror = (e) => reject(e);
            });
        }

        async function seedInitialData() {
            const stories = await getAllStoriesRaw();
            if (stories.length === 0) {
                for (let s of INITIAL_STORIES_DATA) await saveStoryDB(s);
            }
            const cats = await getCategoriesDB();
            if (cats.length === 0) for (let c of DEFAULT_CATEGORIES) await saveCategoryDB({ name: c });
        }

        function getAllStoriesRaw() {
            return new Promise((resolve) => {
                const tx = db.transaction('stories', 'readonly');
                const store = tx.objectStore('stories');
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result || []);
            });
        }

        async function getAllActiveStories() { return (await getAllStoriesRaw()).filter(s => !s.isDeleted); }
        async function getAllDeletedStories() { return (await getAllStoriesRaw()).filter(s => s.isDeleted); }

        function saveStoryDB(story) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction('stories', 'readwrite');
                const request = tx.objectStore('stories').put(story);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e);
            });
        }

        function deleteStoryPermanentDB(id) {
            return new Promise((resolve) => {
                const tx = db.transaction('stories', 'readwrite');
                tx.objectStore('stories').delete(id);
                tx.oncomplete = () => resolve();
            });
        }

        function getCategoriesDB() {
            return new Promise((resolve) => {
                const tx = db.transaction('categories', 'readonly');
                const req = tx.objectStore('categories').getAll();
                req.onsuccess = () => resolve((req.result || []).map(c => c.name));
            });
        }

        function saveCategoryDB(categoryObj) {
            return new Promise((resolve) => {
                const tx = db.transaction('categories', 'readwrite');
                tx.objectStore('categories').put(categoryObj);
                tx.oncomplete = () => resolve();
            });
        }

        function removeCategoryDB(name) {
            return new Promise((resolve) => {
                const tx = db.transaction('categories', 'readwrite');
                tx.objectStore('categories').delete(name);
                tx.oncomplete = () => resolve();
            });
        }

        function showCustomModal(title, msg, onConfirm) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            modal.classList.remove('hidden');

            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            const cleanup = () => {
                modal.classList.add('hidden');
                confirmBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            confirmBtn.onclick = () => { cleanup(); onConfirm(); };
            cancelBtn.onclick = () => cleanup();
        }

        function saveProgress(storyId, chapterIdx) {
            const progress = JSON.parse(localStorage.getItem('reading_progress') || '{}');
            progress[storyId] = { chapterIdx, updatedAt: Date.now() };
            localStorage.setItem('reading_progress', JSON.stringify(progress));
        }

        function getProgress(storyId) {
            return (JSON.parse(localStorage.getItem('reading_progress') || '{}'))[storyId] || null;
        }

        function toggleFavorite(storyId) {
            let favs = JSON.parse(localStorage.getItem('favorites') || '[]');
            if (favs.includes(storyId)) {
                favs = favs.filter(id => id !== storyId);
                showToast("Đã xóa khỏi Tủ Sách Yêu Thích");
            } else {
                favs.push(storyId);
                showToast("Đã thêm vào Tủ Sách Yêu Thích");
            }
            localStorage.setItem('favorites', JSON.stringify(favs));
            renderView();
        }

        function isFavorite(storyId) {
            return (JSON.parse(localStorage.getItem('favorites') || '[]')).includes(storyId);
        }

        function getLibraryFolders() {
            return JSON.parse(localStorage.getItem('library_folders') || '["Yêu thích", "HE", "Sủng, ngọt", "Cao H"]');
        }

        function saveLibraryFolders(folders) {
            localStorage.setItem('library_folders', JSON.stringify(folders));
        }

        function addLibraryFolder(folderName) {
            let folders = getLibraryFolders();
            if (folderName && !folders.includes(folderName)) {
                folders.push(folderName);
                saveLibraryFolders(folders);
                showToast(`Đã tạo danh sách đọc "${folderName}"`);
            }
        }

        function deleteLibraryFolder(folderName) {
            showCustomModal("Xóa danh sách", `Bạn có muốn xóa danh sách đọc "${folderName}" không?`, () => {
                let folders = getLibraryFolders().filter(f => f !== folderName);
                saveLibraryFolders(folders);
                showToast(`Đã xóa danh sách "${folderName}"`);
                renderView();
            });
        }

        function getStoryListsMap() {
            return JSON.parse(localStorage.getItem('story_lists_map') || '{}');
        }

        function toggleStoryInList(storyId, listName) {
            let map = getStoryListsMap();
            if (!map[storyId]) map[storyId] = [];
            
            if (map[storyId].includes(listName)) {
                map[storyId] = map[storyId].filter(l => l !== listName);
                showToast(`Đã xóa khỏi danh sách "${listName}"`);
            } else {
                map[storyId].push(listName);
                showToast(`Đã thêm vào danh sách "${listName}"`);
            }
            localStorage.setItem('story_lists_map', JSON.stringify(map));
            renderAddToListModalContent();
        }

        function removeStoryFromCurrentList(storyId, listName) {
            if (listName === 'Tất cả') {
                toggleFavorite(storyId);
            } else {
                let map = getStoryListsMap();
                if (map[storyId]) {
                    map[storyId] = map[storyId].filter(l => l !== listName);
                    localStorage.setItem('story_lists_map', JSON.stringify(map));
                    showToast(`Đã xóa khỏi danh sách "${listName}"`);
                    renderView();
                }
            }
        }

        function toggleStoryMenuOptions(storyId, e) {
            e.stopPropagation();
            const menu = document.getElementById(`story-option-menu-${storyId}`);
            if (menu) {
                const isHidden = menu.classList.contains('hidden');
                document.querySelectorAll('.story-option-popover').forEach(m => m.classList.add('hidden'));
                if (isHidden) menu.classList.remove('hidden');
            }
        }

        function openAddToListModal(storyId) {
            targetStoryForAddList = storyId;
            renderAddToListModalContent();
            document.getElementById('add-to-list-modal').classList.remove('hidden');
        }

        function closeAddToListModal() {
            document.getElementById('add-to-list-modal').classList.add('hidden');
            renderView();
        }

        function renderAddToListModalContent() {
            const container = document.getElementById('user-lists-container');
            const folders = getLibraryFolders();
            const map = getStoryListsMap();
            const currentLists = map[targetStoryForAddList] || [];

            container.innerHTML = folders.map(listName => {
                const isChecked = currentLists.includes(listName);
                return `
                    <div onclick="toggleStoryInList('${targetStoryForAddList}', '${listName}')" class="flex items-center justify-between p-2.5 bg-gray-950 rounded-xl border border-gray-800 hover:border-blue-500/50 cursor-pointer transition">
                        <span class="text-xs font-semibold text-gray-200">🗂️ ${listName}</span>
                        <span class="text-sm">${isChecked ? '🩵' : '⚪'}</span>
                    </div>
                `;
            }).join('');
        }

        function handleCreateNewListFromModal() {
            const input = document.getElementById('modal-new-list-input');
            const val = input.value.trim();
            if (val) {
                addLibraryFolder(val);
                input.value = '';
                renderAddToListModalContent();
            } else {
                showToast("Vui lòng nhập tên danh sách đọc!", "info");
            }
        }

        function applyGlobalSettings() {
            document.getElementById('app-body').className = `bg-gray-950 text-gray-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white transition-colors ${appSettings.primaryFont}`;
            const titleEl = document.getElementById('nav-title');
            if (titleEl) titleEl.innerText = appSettings.siteTitle || 'TruyệnHay';

            const adminBtn = document.getElementById('nav-admin-btn');
            if (adminBtn) {
                adminBtn.innerHTML = isAdminLoggedIn ? '⚙️ <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-500 rounded-full border-2 border-gray-900"></span>' : '⚙️';
            }
        }

        async function router(view, params = {}) {
            if (view === 'admin' && !isAdminLoggedIn) {
                handleAdminNavClick();
                return;
            }
            appState.currentView = view;
            if (params.id) appState.selectedStoryId = params.id;
            if (params.chapter !== undefined) appState.selectedChapterIndex = params.chapter;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            await renderView();
        }

        async function renderView() {
            applyGlobalSettings();
            const viewport = document.getElementById('app-viewport');
            viewport.className = "flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 animate-fade-in";
            switch (appState.currentView) {
                case 'home': viewport.innerHTML = await renderHome(); break;
                case 'detail': viewport.innerHTML = await renderDetail(); break;
                case 'read': viewport.innerHTML = await renderReader(); break;
                case 'upload': viewport.innerHTML = await renderUpload(); break;
                case 'library': viewport.innerHTML = await renderLibrary(); break;
                case 'admin': viewport.innerHTML = await renderAdmin(); break;
                default: viewport.innerHTML = await renderHome();
            }
        }

        async function renderHome() {
            const stories = await getAllActiveStories();
            const categories = await getCategoriesDB();

            const filtered = stories.filter(s => {
                const matchesCat = appState.selectedCategory === 'Tất cả' || (s.categories && s.categories.includes(appState.selectedCategory));
                const matchesSearch = s.title.toLowerCase().includes(appState.searchQuery.toLowerCase()) || s.author.toLowerCase().includes(appState.searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            return `
                <div class="space-y-8">
                    <!-- Hero Banner -->
                    <div class="relative rounded-3xl bg-gradient-to-r from-blue-900/60 via-indigo-900/40 to-purple-900/40 p-6 sm:p-10 border border-blue-500/20 shadow-2xl overflow-hidden backdrop-blur-xl">
                        <div class="relative z-10 max-w-2xl space-y-3">
                            <span class="px-3 py-1 bg-blue-500/20 border border-blue-400/30 text-blue-300 text-xs font-semibold rounded-full">Trải nghiệm đọc đỉnh cao</span>
                            <h1 class="text-3xl sm:text-4xl font-extrabold text-white leading-tight">${appSettings.heroHeading}</h1>
                            <p class="text-sm sm:text-base text-gray-300">${appSettings.heroSub}</p>
                            <button onclick="router('upload')" class="mt-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-bold shadow-lg shadow-blue-500/30 transition hover:scale-105 active:scale-95">
                                🚀 Đăng Truyện Mới
                            </button>
                        </div>
                    </div>

                    <!-- Category Pills -->
                    <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                        <button onclick="setCategoryFilter('Tất cả')" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap ${appState.selectedCategory === 'Tất cả' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'bg-gray-900 text-gray-400 hover:bg-gray-800 hover:text-white border border-gray-800'}">Tất cả</button>
                        ${categories.map(cat => `
                            <button onclick="setCategoryFilter('${cat}')" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap ${appState.selectedCategory === cat ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'bg-gray-900 text-gray-400 hover:bg-gray-800 hover:text-white border border-gray-800'}">${cat}</button>
                        `).join('')}
                    </div>

                    <!-- Story List -->
                    <div>
                        <h2 class="text-xl font-bold mb-5 flex items-center gap-2"><span>🔥</span> Danh Sách Truyện (${filtered.length})</h2>
                        ${filtered.length === 0 ? `<div class="text-center py-16 bg-gray-900/50 rounded-2xl border border-gray-800/80"><p class="text-gray-400 text-sm">Chưa có truyện phù hợp.</p></div>` : `
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                                ${filtered.map(story => `
                                    <div class="bg-gray-900/80 hover:bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 hover:border-blue-500/40 shadow-lg hover:shadow-2xl hover:shadow-blue-500/10 transition-all duration-300 flex flex-col group cursor-pointer" onclick="router('detail', {id: '${story.id}'})">
                                        <div class="aspect-[3/4] bg-gray-950 relative overflow-hidden">
                                            <img src="${story.cover || 'https://via.placeholder.com/300x400'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                            <button onclick="event.stopPropagation(); toggleFavorite('${story.id}')" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-gray-950/70 backdrop-blur-md flex items-center justify-center text-sm shadow-md hover:scale-110 transition">
                                                ${isFavorite(story.id) ? '❤️' : '🤍'}
                                            </button>
                                            <span class="absolute bottom-2 left-2 bg-gray-950/80 backdrop-blur-md text-blue-400 text-[11px] font-semibold px-2 py-0.5 rounded-md border border-blue-500/20">${story.chapters ? story.chapters.length : 0} Chương</span>
                                        </div>
                                        <div class="p-3.5 flex-1 flex flex-col justify-between space-y-2">
                                            <div>
                                                <h3 class="font-bold text-sm line-clamp-2 text-gray-100 group-hover:text-blue-400 transition">${story.title}</h3>
                                                <p class="text-xs text-gray-400 mt-1">${story.author || 'Tác giả ẩn danh'}</p>
                                            </div>
                                            <div class="flex flex-wrap gap-1">
                                                ${(story.categories || []).slice(0, 2).map(c => `<span class="text-[10px] bg-gray-800 text-gray-300 px-2 py-0.5 rounded-md border border-gray-700/50">${c}</span>`).join('')}
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function setCategoryFilter(cat) { appState.selectedCategory = cat; renderView(); }
        function handleSearch(val) { appState.searchQuery = val; renderView(); }

        async function renderDetail() {
            const stories = await getAllStoriesRaw();
            const story = stories.find(s => s.id === appState.selectedStoryId);
            if (!story) return `<div class="text-center py-16"><p class="text-red-400">Không tìm thấy truyện!</p></div>`;

            const progress = getProgress(story.id);

            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <button onclick="router('home')" class="text-xs font-semibold text-gray-400 hover:text-white flex items-center gap-1 transition">← Quay lại danh sách</button>

                    <div class="bg-gray-900/90 rounded-3xl p-6 sm:p-8 border border-gray-800 shadow-2xl flex flex-col md:flex-row gap-6">
                        <div class="w-full md:w-52 aspect-[3/4] rounded-2xl overflow-hidden bg-gray-950 flex-shrink-0 shadow-lg border border-gray-800">
                            <img src="${story.cover || 'https://via.placeholder.com/300x400'}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 space-y-4">
                            <div>
                                <h1 class="text-2xl sm:text-3xl font-extrabold text-white">${story.title}</h1>
                                <p class="text-xs sm:text-sm text-gray-400 mt-1">Tác giả: <span class="text-gray-200 font-medium">${story.author}</span></p>
                            </div>
                            <div class="flex flex-wrap gap-1.5">
                                ${(story.categories || []).map(c => `<span class="bg-blue-900/40 text-blue-300 border border-blue-500/30 text-xs px-3 py-1 rounded-full font-medium">${c}</span>`).join('')}
                                ${(story.tags || []).map(t => `<span class="bg-gray-800 text-gray-300 text-xs px-3 py-1 rounded-full">#${t}</span>`).join('')}
                            </div>
                            <p class="text-xs sm:text-sm text-gray-300 leading-relaxed bg-gray-950/60 p-4 rounded-2xl border border-gray-800">${story.description || 'Chưa có mô tả.'}</p>
                            
                            <div class="flex flex-wrap items-center gap-2.5 pt-2">
                                ${story.chapters && story.chapters.length > 0 ? `
                                    <button onclick="router('read', {id: '${story.id}', chapter:${progress ? progress.chapterIdx : 0}})" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-white shadow-lg shadow-blue-600/30 transition hover:scale-105 active:scale-95 text-xs sm:text-sm">
                                        📖 ${progress ? `Đọc Tiếp (Chương ${progress.chapterIdx + 1})` : 'Đọc Từ Đầu'}
                                    </button>
                                ` : `<button disabled class="px-5 py-2.5 bg-gray-800 text-gray-500 rounded-xl text-xs font-semibold">Chưa có chương</button>`}
                                
                                <button onclick="toggleFavorite('${story.id}')" class="px-4 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-xl text-xs font-semibold transition">
                                    ${isFavorite(story.id) ? '❤️ Đã Thích' : '🤍 Yêu Thích'}
                                </button>

                                <button onclick="openAddToListModal('${story.id}')" class="px-4 py-2.5 bg-indigo-600/80 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition shadow-lg shadow-indigo-600/20 flex items-center gap-1">
                                    📚 Thêm Vào Danh Sách
                                </button>
                                
                                ${isAdminLoggedIn ? `
                                    <button onclick="openAddChapterModal('${story.id}')" class="px-4 py-2.5 bg-emerald-600/80 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold transition shadow-lg shadow-emerald-600/20">
                                        ➕ Thêm Chương Mới
                                    </button>
                                    <button onclick="softDeleteStory('${story.id}')" class="px-3 py-2.5 bg-red-950/40 hover:bg-red-900/60 text-red-400 rounded-xl text-xs font-semibold border border-red-800/40 transition ml-auto">
                                        🗑️ Xóa Truyện
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <!-- Chapters Container -->
                    <div class="bg-gray-900/90 rounded-3xl p-6 border border-gray-800 space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-base sm:text-lg font-bold">Danh Sách Chương (${story.chapters ? story.chapters.length : 0})</h2>
                            ${isAdminLoggedIn ? `<button onclick="openAddChapterModal('${story.id}')" class="text-xs font-semibold text-blue-400 hover:underline">➕ Thêm chương mới</button>` : ''}
                        </div>
                        <div class="divide-y divide-gray-800 max-h-96 overflow-y-auto pr-1">
                            ${(story.chapters || []).map((ch, idx) => `
                                <div onclick="router('read', {id: '${story.id}', chapter:${idx}})" class="py-3 px-3 hover:bg-gray-800/60 rounded-xl cursor-pointer flex justify-between items-center transition group">
                                    <span class="text-xs sm:text-sm font-medium text-gray-300 group-hover:text-blue-400 transition">${ch.title || `Chương ${idx + 1}`}</span>
                                    ${progress && progress.chapterIdx === idx ? '<span class="text-[10px] bg-blue-900/60 text-blue-300 border border-blue-500/30 px-2.5 py-0.5 rounded-full font-semibold">Đang đọc</span>' : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function openAddChapterModal(storyId) {
            const modal = document.getElementById('add-chapter-modal');
            document.getElementById('modal-ch-title').value = '';
            document.getElementById('modal-ch-content').value = '';
            modal.classList.remove('hidden');

            document.getElementById('save-chapter-btn').onclick = async () => {
                const title = document.getElementById('modal-ch-title').value.trim();
                const content = document.getElementById('modal-ch-content').value.trim();
                if (!title || !content) {
                    showToast("Vui lòng điền đủ tiêu đề và nội dung chương!", "info");
                    return;
                }

                const stories = await getAllStoriesRaw();
                const story = stories.find(s => s.id === storyId);
                if (story) {
                    if (!story.chapters) story.chapters = [];
                    story.chapters.push({ title, content });
                    await saveStoryDB(story);
                    closeAddChapterModal();
                    showToast("Đã thêm chương mới thành công!");
                    renderView();
                }
            };
        }

        function closeAddChapterModal() {
            document.getElementById('add-chapter-modal').classList.add('hidden');
        }

        function softDeleteStory(id) {
            showCustomModal("Xóa truyện", "Bạn có chắc chắn muốn chuyển bộ truyện này vào Thùng Rác?", async () => {
                const stories = await getAllStoriesRaw();
                const story = stories.find(s => s.id === id);
                if (story) {
                    story.isDeleted = true;
                    await saveStoryDB(story);
                    showToast("Đã chuyển truyện vào Thùng Rác");
                    router('home');
                }
            });
        }

        async function renderReader() {
            const stories = await getAllStoriesRaw();
            const story = stories.find(s => s.id === appState.selectedStoryId);
            if (!story || !story.chapters || !story.chapters[appState.selectedChapterIndex]) {
                return `<div class="text-center py-16"><p class="text-red-400">Chương không tồn tại!</p></div>`;
            }

            const chapter = story.chapters[appState.selectedChapterIndex];
            saveProgress(story.id, appState.selectedChapterIndex);

            return `
                <div class="max-w-4xl mx-auto space-y-4">
                    <!-- Reader Toolbar -->
                    <div class="bg-gray-900/90 backdrop-blur-md sticky top-16 z-30 p-3 rounded-2xl border border-gray-800 shadow-xl flex flex-wrap items-center justify-between gap-3 text-xs">
                        <button onclick="router('detail', {id: '${story.id}'})" class="text-gray-300 hover:text-white flex items-center gap-1 font-semibold">← Bìa truyện</button>

                        <div class="relative inline-block">
                            <button onclick="toggleTOCMenu()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded-xl font-semibold flex items-center gap-1 border border-gray-700">
                                ≡ Mục Lục (${appState.selectedChapterIndex + 1}/${story.chapters.length})
                            </button>
                            <div id="toc-popup-menu" class="hidden absolute left-0 mt-2 w-64 max-h-80 overflow-y-auto bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl z-50 p-2 divide-y divide-gray-800">
                                ${story.chapters.map((ch, idx) => `
                                    <button onclick="router('read', {id: '${story.id}', chapter:${idx}}); toggleTOCMenu();" class="w-full text-left px-3 py-2 text-xs hover:bg-gray-800 rounded-xl transition ${idx === appState.selectedChapterIndex ? 'text-blue-400 font-bold bg-blue-950/30' : 'text-gray-300'}">
                                        ${ch.title || `Chương ${idx + 1}`}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <select onchange="changeReaderFont(this.value)" class="bg-gray-950 border border-gray-800 rounded-xl px-2.5 py-1.5 text-xs text-gray-200 focus:outline-none">
                            <option value="font-inter" ${appState.readerFont === 'font-inter' ? 'selected' : ''}>Inter (Mặc định)</option>
                            <option value="font-lora" ${appState.readerFont === 'font-lora' ? 'selected' : ''}>Lora (Có chân)</option>
                            <option value="font-merriweather" ${appState.readerFont === 'font-merriweather' ? 'selected' : ''}>Merriweather</option>
                            <option value="font-mono" ${appState.readerFont === 'font-mono' ? 'selected' : ''}>Monospace</option>
                        </select>

                        <div class="flex items-center gap-1 bg-gray-950 px-2 py-1 rounded-xl border border-gray-800">
                            <button onclick="adjustReaderSize(-2)" class="px-2 font-bold hover:text-blue-400">A-</button>
                            <span class="text-xs w-6 text-center font-medium">${appState.readerSize}</span>
                            <button onclick="adjustReaderSize(2)" class="px-2 font-bold hover:text-blue-400">A+</button>
                        </div>

                        <div class="flex items-center gap-1.5">
                            <button onclick="setReaderTheme('reader-theme-light')" class="w-6 h-6 rounded-full bg-white border border-gray-400" title="Sáng"></button>
                            <button onclick="setReaderTheme('reader-theme-sepia')" class="w-6 h-6 rounded-full bg-[#fbf0d9] border border-amber-300" title="Vàng Sepia"></button>
                            <button onclick="setReaderTheme('reader-theme-charcoal')" class="w-6 h-6 rounded-full bg-[#262a33] border border-gray-600" title="Xám"></button>
                            <button onclick="setReaderTheme('reader-theme-dark')" class="w-6 h-6 rounded-full bg-[#0d1117] border border-gray-800" title="Tối"></button>
                        </div>
                    </div>

                    <!-- Reader Content -->
                    <div id="reader-content-box" class="${appState.readerTheme} ${appState.readerFont} rounded-3xl p-6 sm:p-12 border border-gray-800 shadow-2xl transition-all duration-200" style="font-size: ${appState.readerSize}px; line-height: 1.8;">
                        <h1 class="text-2xl sm:text-3xl font-extrabold mb-8 text-center border-b pb-6 border-gray-700/30">${chapter.title}</h1>
                        <div class="whitespace-pre-wrap">${chapter.content}</div>
                    </div>

                    <!-- Bottom Nav -->
                    <div class="flex items-center justify-between py-4">
                        <button onclick="router('read', {id: '${story.id}', chapter: ${appState.selectedChapterIndex - 1}})" ${appState.selectedChapterIndex <= 0 ? 'disabled class="opacity-40 cursor-not-allowed px-4 py-2 bg-gray-900 rounded-xl text-xs font-semibold"' : 'class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow-lg transition"'}>← Chương trước</button>
                        <span class="text-xs text-gray-500 font-semibold">${appState.selectedChapterIndex + 1} / ${story.chapters.length}</span>
                        <button onclick="router('read', {id: '${story.id}', chapter: ${appState.selectedChapterIndex + 1}})" ${appState.selectedChapterIndex >= story.chapters.length - 1 ? 'disabled class="opacity-40 cursor-not-allowed px-4 py-2 bg-gray-900 rounded-xl text-xs font-semibold"' : 'class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shadow-lg transition"'}>Chương sau →</button>
                    </div>
                </div>
            `;
        }

        function toggleTOCMenu() {
            const menu = document.getElementById('toc-popup-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        function changeReaderFont(fontClass) {
            appState.readerFont = fontClass;
            const box = document.getElementById('reader-content-box');
            if (box) box.className = `${appState.readerTheme} ${fontClass} rounded-3xl p-6 sm:p-12 border border-gray-800 shadow-2xl transition-all duration-200`;
        }

        function adjustReaderSize(delta) {
            appState.readerSize = Math.max(12, Math.min(32, appState.readerSize + delta));
            const box = document.getElementById('reader-content-box');
            if (box) box.style.fontSize = `${appState.readerSize}px`;
        }

        function setReaderTheme(themeClass) {
            appState.readerTheme = themeClass;
            const box = document.getElementById('reader-content-box');
            if (box) box.className = `${themeClass} ${appState.readerFont} rounded-3xl p-6 sm:p-12 border border-gray-800 shadow-2xl transition-all duration-200`;
        }

        async function renderUpload() {
            const categories = await getCategoriesDB();
            appState.uploadChapterCount = 1;

            return `
                <div class="max-w-2xl mx-auto bg-gray-900/90 rounded-3xl p-6 sm:p-8 border border-gray-800 shadow-2xl space-y-6">
                    <h1 class="text-2xl font-bold flex items-center gap-2"><span>✍️</span> Đăng Truyện Mới</h1>

                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1 text-gray-300">Link Ảnh Bìa (URL)</label>
                            <input type="url" id="up-cover" placeholder="https://..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm focus:border-blue-500 focus:outline-none">

                        <div>
                            <label class="block text-xs font-semibold mb-1 text-gray-300">Thể loại (Chọn nhiều)</label>

                                ${categories.map(c => `
                                    <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer">

                                    </label>

                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1 text-gray-300">Thêm Tag Tùy Chỉnh (Phân cách bằng dấu phẩy)</label>
                            <input type="text" id="up-tags" placeholder="Hành Động, Trọng Sinh" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm focus:border-blue-500 focus:outline-none">

                            <label class="block text-xs font-semibold mb-1 text-gray-300">Tóm tắt nội dung</label>
                            <textarea id="up-desc" rows="3" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm focus:border-blue-500 focus:outline-none"></textarea>
                        </div>

                        <!-- Chapters Container -->
                        <div class="border-t border-gray-800 pt-5 space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="font-bold text-sm text-blue-400">Nội Dung Các Chương</h3>
                                <button type="button" onclick="addMoreUploadChapterField()" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-blue-300 rounded-lg text-xs font-semibold transition">➕ Thêm Chương Khác</button>
                            </div>

                            <div id="upload-chapters-list" class="space-y-4">
                                <div class="upload-chapter-item bg-gray-950/60 p-4 rounded-2xl border border-gray-800 space-y-2">
                                    <input type="text" class="up-ch-title w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs font-semibold text-blue-300" placeholder="Tiêu đề (VD: Chương 1: Khởi đầu)">
                                    <textarea class="up-ch-content w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs" rows="4" placeholder="Nội dung chương..."></textarea>

                            </div>
                        </div>

                        <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 font-bold rounded-2xl text-white shadow-xl shadow-blue-600/20 transition">🚀 Hoàn Tất & Đăng Truyện</button>
                    </form>
                </div>
            `;
        }

        function addMoreUploadChapterField() {
            appState.uploadChapterCount++;
            const container = document.getElementById('upload-chapters-list');
            const div = document.createElement('div');
            div.className = "upload-chapter-item bg-gray-950/60 p-4 rounded-2xl border border-gray-800 space-y-2";
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-400">Chương ${appState.uploadChapterCount}</span>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-xs text-red-400 hover:underline">Xóa chương này</button>
                </div>
                <input type="text" class="up-ch-title w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs font-semibold text-blue-300" placeholder="Tiêu đề (VD: Chương ${appState.uploadChapterCount})">
                <textarea class="up-ch-content w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs" rows="4" placeholder="Nội dung chương..."></textarea>
            `;
            container.appendChild(div);
        }

        async function handleUploadSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('up-title').value.trim();
            const author = document.getElementById('up-author').value.trim() || 'Ẩn danh';
            const cover = document.getElementById('up-cover').value.trim();
            const desc = document.getElementById('up-desc').value.trim();

            const checkedCats = Array.from(document.querySelectorAll('input[name="up-categories"]:checked')).map(el => el.value);
            const customTags = document.getElementById('up-tags').value.split(',').map(t => t.trim()).filter(t => t);

            const chapterItems = document.querySelectorAll('.upload-chapter-item');
            const chapters = [];
            chapterItems.forEach((item, idx) => {
                const chTitle = item.querySelector('.up-ch-title').value.trim() || `Chương ${idx + 1}`;
                const chContent = item.querySelector('.up-ch-content').value.trim();
                if (chContent) chapters.push({ title: chTitle, content: chContent });
            });

            if (chapters.length === 0) {
                showToast("Vui lòng nhập ít nhất một chương truyện!", "info");
                return;
            }

            const newStory = {
                id: 'story-' + Date.now(),
                title, author, cover, description: desc,
                categories: checkedCats, tags: customTags, isDeleted: false,
                chapters: chapters
            };

            await saveStoryDB(newStory);
            showToast("Đã đăng truyện thành công!");
            router('detail', { id: newStory.id });
        }

        async function renderLibrary() {
            const stories = await getAllActiveStories();
            const favIds = JSON.parse(localStorage.getItem('favorites') || '[]');
            const folders = getLibraryFolders();
            const map = getStoryListsMap();

            let filteredStories = stories.filter(s => favIds.includes(s.id));
            if (activeLibraryFolder !== 'Tất cả') {
                filteredStories = stories.filter(s => {
                    const userLists = map[s.id] || [];
                    return userLists.includes(activeLibraryFolder);
                });
            }

            return `
                <div class="space-y-6" onclick="document.querySelectorAll('.story-option-popover').forEach(m => m.classList.add('hidden'))">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-gray-800 pb-4">
                        <h1 class="text-2xl font-bold flex items-center gap-2"><span>📚</span> Tủ Sách & Danh Sách Đọc (${filteredStories.length})</h1>
                        
                        <div class="flex items-center gap-2 w-full md:w-auto">
                            <input type="text" id="new-folder-input" placeholder="Thêm danh sách đọc mới..." class="bg-gray-900 border border-gray-700/80 rounded-xl px-3.5 py-2 text-xs text-gray-200 focus:outline-none focus:border-blue-500 flex-1 md:w-60">
                            <button onclick="handleAddNewFolder()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-xl text-sm shadow-lg shadow-blue-600/30 transition flex items-center justify-center">
                                +
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-2">
                        <button onclick="setLibraryFolder('Tất cả')" class="px-4 py-2 rounded-xl text-xs font-semibold transition ${activeLibraryFolder === 'Tất cả' ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-900 text-gray-300 hover:bg-gray-800 border border-gray-800'}">Tất cả yêu thích (${stories.filter(s => favIds.includes(s.id)).length})</button>
                        ${folders.map(folder => `
                            <div class="flex items-center gap-1 px-3 py-1.5 bg-gray-900 border border-gray-800 rounded-xl text-xs font-medium text-gray-300">
                                <span onclick="setLibraryFolder('${folder}')" class="cursor-pointer hover:text-blue-400 ${activeLibraryFolder === folder ? 'text-blue-400 font-bold' : ''}">🗂️ ${folder}</span>
                                <button onclick="deleteLibraryFolder('${folder}')" class="text-red-400 hover:text-red-300 ml-1 font-bold">×</button>
                            </div>
                        `).join('')}
                    </div>

                    ${filteredStories.length === 0 ? `<div class="text-center py-16 bg-gray-900/50 rounded-2xl border border-gray-800"><p class="text-gray-400 text-sm">Chưa có truyện trong danh sách đọc này.</p></div>` : `
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                            ${filteredStories.map(story => `
                                <div class="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 shadow-lg hover:shadow-2xl transition flex flex-col group cursor-pointer relative" onclick="router('detail', {id: '${story.id}'})">
                                    <div class="aspect-[3/4] bg-gray-950 relative">
                                        <img src="${story.cover || 'https://via.placeholder.com/300x400'}" class="w-full h-full object-cover">
                                        
                                        <button onclick="toggleStoryMenuOptions('${story.id}', event)" class="absolute top-2.5 left-2.5 w-8 h-8 rounded-full bg-gray-950/80 backdrop-blur-md flex items-center justify-center text-gray-200 hover:text-white font-bold text-base shadow-md hover:scale-110 transition z-10" title="Tùy chọn">
                                            ⋮
                                        </button>

                                        <div id="story-option-menu-${story.id}" class="story-option-popover hidden absolute top-12 left-2.5 w-48 bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl z-30 p-1.5 space-y-1 text-xs" onclick="event.stopPropagation()">
                                            <button onclick="removeStoryFromCurrentList('${story.id}', '${activeLibraryFolder}')" class="w-full text-left px-3 py-2 hover:bg-red-950/40 text-red-400 rounded-xl font-semibold transition flex items-center gap-2">
                                                <span>❌</span> Xóa khỏi danh sách này
                                            </button>
                                            <button onclick="openAddToListModal('${story.id}')" class="w-full text-left px-3 py-2 hover:bg-gray-800 text-gray-200 rounded-xl font-medium transition flex items-center gap-2">
                                                <span>⚙️</span> Quản lý danh sách đọc
                                            </button>
                                        </div>

                                        <button onclick="event.stopPropagation(); toggleFavorite('${story.id}')" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-gray-950/70 flex items-center justify-center text-sm shadow-md">❤️</button>
                                    </div>
                                    <div class="p-3.5">
                                        <h3 class="font-bold text-sm line-clamp-1">${story.title}</h3>
                                        <p class="text-xs text-gray-400 mt-1">${story.author}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function handleAddNewFolder() {
            const input = document.getElementById('new-folder-input');
            const val = input.value.trim();
            if (val) {
                addLibraryFolder(val);
                input.value = '';
            } else {
                showToast("Vui lòng nhập tên danh sách đọc!", "info");
            }
        }

        function setLibraryFolder(folderName) {
            activeLibraryFolder = folderName;
            renderView();
        }

        async function renderAdmin() {
            const activeStories = await getAllActiveStories();
            const deletedStories = await getAllDeletedStories();
            const categories = await getCategoriesDB();

            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                        <div class="flex items-center gap-3">
                            <h1 class="text-2xl font-bold flex items-center gap-2"><span>⚙️</span> Trang Quản Trị Admin</h1>
                            <span class="text-xs bg-emerald-900/40 text-emerald-300 border border-emerald-500/30 px-3 py-0.5 rounded-full font-semibold">Đã đăng nhập</span>
                        </div>
                        <button onclick="logoutAdmin()" class="px-3.5 py-1.5 bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-800/40 rounded-xl text-xs font-semibold transition">Đăng Xuất Admin</button>
                    </div>

                    <!-- Custom UI Section -->
                    <div class="bg-gray-900/90 rounded-3xl p-6 border border-gray-800 space-y-4">
                        <h2 class="font-bold text-base text-blue-400 flex items-center gap-2"><span>🎨</span> Tùy Chỉnh Giao Diện Website</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                            <div>
                                <label class="block font-semibold mb-1 text-gray-300">Tên Website / Thương Hiệu</label>
                                <input type="text" id="setting-site-title" value="${appSettings.siteTitle}" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-gray-300">Font Chữ Toàn Trang</label>
                                <select id="setting-site-font" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-gray-200">
                                    <option value="font-inter" ${appSettings.primaryFont === 'font-inter' ? 'selected' : ''}>Inter (Hiện đại)</option>
                                    <option value="font-lora" ${appSettings.primaryFont === 'font-lora' ? 'selected' : ''}>Lora (Thơ mộng)</option>
                                    <option value="font-merriweather" ${appSettings.primaryFont === 'font-merriweather' ? 'selected' : ''}>Merriweather (Cổ điển)</option>
                                    <option value="font-mono" ${appSettings.primaryFont === 'font-mono' ? 'selected' : ''}>Monospace (Lập trình)</option>
                                </select>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block font-semibold mb-1 text-gray-300">Tiêu Đề Banner Trang Chủ</label>
                                <input type="text" id="setting-hero-head" value="${appSettings.heroHeading}" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2">
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block font-semibold mb-1 text-gray-300">Mô Tả Phụ Banner</label>
                                <input type="text" id="setting-hero-sub" value="${appSettings.heroSub}" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2">
                            </div>
                        </div>
                        <button onclick="saveAdminThemeSettings()" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-blue-600/20">💾 Lưu Cấu Hình Giao Diện</button>
                    </div>

                    <!-- SAO LƯU & KHÔI PHỤC DỮ LIỆU JSON -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-gray-900/90 rounded-2xl p-5 border border-gray-800 space-y-3">
                            <h2 class="font-bold text-base text-blue-400">⬇️ Xuất Dữ Liệu (Backup JSON)</h2>
                            <p class="text-xs text-gray-400">Tải file JSON chứa toàn bộ truyện, chương và dữ liệu để dán vào code hoặc lưu trữ.</p>
                            <button onclick="exportAllStoriesJSON()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold transition shadow-lg shadow-blue-600/20">Tải File Backup (.JSON)</button>
                        </div>

                        <div class="bg-gray-900/90 rounded-2xl p-5 border border-gray-800 space-y-3">
                            <h2 class="font-bold text-base text-emerald-400">⬆️ Nhập Dữ Liệu (Restore JSON)</h2>
                            <p class="text-xs text-gray-400">Chọn file JSON đã lưu từ máy khác để đồng bộ ngay lập tức.</p>
                            <label class="block w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold text-center cursor-pointer transition shadow-lg shadow-emerald-600/20">
                                Chọn File JSON Để Đồng Bộ
                                <input type="file" accept=".json" onchange="importStoriesJSON(event)" class="hidden">
                            </label>
                        </div>
                    </div>

                    <div class="bg-gray-900/90 rounded-2xl p-5 border border-gray-800 space-y-3">
                        <h2 class="font-bold text-base text-blue-400">🏷️ Quản Lý Thể Loại & Mục Truyện</h2>
                        <div class="flex gap-2">
                            <input type="text" id="admin-new-cat" placeholder="Tạo thể loại mới..." class="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-3 py-1.5 text-xs">
                            <button onclick="handleAddCategory()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold">Tạo Mục</button>
                        </div>
                        <div class="flex flex-wrap gap-2 pt-2">
                            ${categories.map(cat => `
                                <div class="bg-gray-950 border border-gray-800 text-xs px-3 py-1.5 rounded-xl flex items-center gap-2">
                                    <span class="font-semibold text-gray-200">${cat}</span>
                                    <button onclick="handleDeleteCategory('${cat}')" class="text-red-400 font-bold hover:text-red-300 text-sm ml-1" title="Xóa thể loại này">×</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-gray-900/90 rounded-2xl p-6 border border-gray-800 space-y-4">
                        <h2 class="font-bold text-base text-red-400">🗑️ Thùng Rác - Truyện Đã Xóa (${deletedStories.length})</h2>
                        ${deletedStories.length === 0 ? `<p class="text-xs text-gray-500 italic">Thùng rác trống.</p>` : `
                            <div class="divide-y divide-gray-800">
                                ${deletedStories.map(s => `
                                    <div class="py-3 flex items-center justify-between gap-4">
                                        <div>
                                            <h4 class="font-semibold text-xs sm:text-sm text-gray-200">${s.title}</h4>
                                            <p class="text-[11px] text-gray-400">${s.author} - ${s.chapters ? s.chapters.length : 0} chương</p>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <button onclick="restoreStory('${s.id}')" class="px-3 py-1 bg-emerald-700/80 hover:bg-emerald-600 text-white rounded-lg text-xs font-semibold">Khôi phục</button>
                                            <button onclick="deletePermanent('${s.id}')" class="px-3 py-1 bg-red-800/80 hover:bg-red-700 text-white rounded-lg text-xs font-semibold">Xóa vĩnh viễn</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>

                    <div class="bg-gray-900/90 rounded-2xl p-6 border border-gray-800 space-y-4">
                        <h2 class="font-bold text-base text-gray-200">📖 Truyện Đang Hoạt Động (${activeStories.length})</h2>
                        <div class="divide-y divide-gray-800 max-h-80 overflow-y-auto">
                            ${activeStories.map(s => `
                                <div class="py-3 flex items-center justify-between gap-4">
                                    <div>
                                        <h4 class="font-semibold text-xs sm:text-sm text-gray-200">${s.title}</h4>
                                        <p class="text-[11px] text-gray-400">${s.author}</p>
                                    </div>
                                    <button onclick="softDeleteStory('${s.id}')" class="px-3 py-1 bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-800/30 rounded-lg text-xs">Bỏ vào thùng rác</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function saveAdminThemeSettings() {
            appSettings.siteTitle = document.getElementById('setting-site-title').value.trim() || 'TruyệnHay';
            appSettings.primaryFont = document.getElementById('setting-site-font').value;
            appSettings.heroHeading = document.getElementById('setting-hero-head').value.trim();
            appSettings.heroSub = document.getElementById('setting-hero-sub').value.trim();

            localStorage.setItem('app_admin_settings', JSON.stringify(appSettings));
            showToast("Đã lưu cài đặt giao diện thành công!");
            renderView();
        }

        async function handleAddCategory() {
            const val = document.getElementById('admin-new-cat').value.trim();
            if (val) {
                await saveCategoryDB({ name: val });
                showToast(`Đã tạo thể loại "${val}"`);
                renderView();
            }
        }

        function handleDeleteCategory(name) {
            showCustomModal("Xóa thể loại", `Bạn có chắc chắn muốn xóa thể loại "${name}"?`, async () => {
                await removeCategoryDB(name);
                showToast(`Đã xóa thể loại "${name}"`);
                renderView();
            });
        }

        async function restoreStory(id) {
            const stories = await getAllStoriesRaw();
            const story = stories.find(s => s.id === id);
            if (story) {
                story.isDeleted = false;
                await saveStoryDB(story);
                showToast("Đã khôi phục truyện!");
                renderView();
            }
        }

        function deletePermanent(id) {
            showCustomModal("Xóa vĩnh viễn", "Hành động này sẽ xóa vĩnh viễn truyện và không thể khôi phục!", async () => {
                await deleteStoryPermanentDB(id);
                showToast("Đã xóa vĩnh viễn truyện!");
                renderView();
            });
        }

        async function exportAllStoriesJSON() {
            const stories = await getAllStoriesRaw();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stories, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", `truyenhay_backup_${Date.now()}.json`);
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast("Đã xuất file dữ liệu sao lưu!");
        }

        function importStoriesJSON(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const importedStories = JSON.parse(event.target.result);
                    if (!Array.isArray(importedStories)) {
                        throw new Error("File JSON không hợp lệ");
                    }

                    for (let story of importedStories) {
                        if (story.id) {
                            await saveStoryDB(story);
                        }
                    }

                    showToast("Đã đồng bộ dữ liệu thành công!");
                    router('home');
                } catch (err) {
                    showToast("Lỗi: File JSON không đúng định dạng!", "info");
                }
            };
            reader.readAsText(file);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            renderView();
        });
    </script>
</body>
</html>
