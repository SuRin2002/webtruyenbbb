<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruyệnHay Premium Reader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.25s ease-out forwards',
                        'pop-in': 'popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-in': 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        popIn: { '0%': { transform: 'scale(0.92)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } },
                        slideIn: { '0%': { transform: 'translateX(100%)', opacity: 0 }, '100%': { transform: 'translateX(0)', opacity: 1 } }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style id="custom-theme-styles">
        body { font-family: 'Inter', sans-serif; }
        .font-lora { font-family: 'Lora', serif !important; }
        .font-merriweather { font-family: 'Merriweather', serif !important; }
        .font-inter { font-family: 'Inter', sans-serif !important; }
        .font-mono { font-family: 'Roboto Mono', monospace !important; }
        
        .reader-theme-light { background-color: #ffffff !important; color: #1f2937 !important; }
        .reader-theme-sepia { background-color: #fbf0d9 !important; color: #432818 !important; }
        .reader-theme-charcoal { background-color: #262a33 !important; color: #e5e7eb !important; }
        .reader-theme-dark { background-color: #0d1117 !important; color: #d1d5db !important; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body id="app-body" class="bg-gray-950 text-gray-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white transition-colors">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- NAVBAR -->
    <header class="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-md border-b border-gray-800/80 shadow-xl transition-all">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="router('home')">
                <div id="nav-logo-box" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-xl shadow-lg shadow-blue-500/20 group-hover:scale-105 transition duration-300">
                    📖
                </div>
                <span id="nav-title" class="text-xl font-extrabold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">TruyệnHay</span>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md relative hidden sm:block">
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Tìm kiếm truyện, tác giả..." class="w-full bg-gray-950/80 border border-gray-800 rounded-xl px-4 py-2 pl-10 text-sm text-gray-200 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                <span class="absolute left-3.5 top-2.5 text-gray-400 text-sm">🔍</span>
            </div>

            <!-- Nav Buttons -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <button onclick="router('home')" class="px-3 py-2 rounded-xl hover:bg-gray-800 text-xs sm:text-sm font-medium transition text-gray-300 hover:text-white">Trang Chủ</button>
                <button onclick="router('library')" class="px-3 py-2 rounded-xl hover:bg-gray-800 text-xs sm:text-sm font-medium transition text-gray-300 hover:text-white">Tủ Sách</button>
                <button onclick="router('upload')" class="px-3.5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-lg shadow-blue-600/25 transition active:scale-95 flex items-center gap-1">
                    <span>➕</span> <span class="hidden sm:inline">Đăng Truyện</span>
                </button>
                <button onclick="handleAdminNavClick()" id="nav-admin-btn" class="p-2 rounded-xl hover:bg-gray-800 text-gray-400 hover:text-white transition relative" title="Quản trị">
                    ⚙️
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 animate-fade-in" id="app-viewport"></main>

    <!-- CUSTOM MODAL CONFIRMATION -->
    <div id="custom-modal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl animate-pop-in space-y-4">
            <h3 id="modal-title" class="text-lg font-bold text-gray-100">Xác nhận</h3>
            <p id="modal-msg" class="text-sm text-gray-400 leading-relaxed"></p>
            <div class="flex justify-end gap-3 pt-2">
                <button id="modal-cancel-btn" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-300 transition">Hủy</button>
                <button id="modal-confirm-btn" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-xs font-semibold text-white shadow-lg transition">Đồng ý</button>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM TRUYỆN VÀO DANH SÁCH ĐỌC -->
    <div id="add-to-list-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl animate-pop-in space-y-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="text-base font-bold text-blue-400 flex items-center gap-2">📚 Lưu Vào Danh Sách Đọc</h3>
                <button onclick="closeAddToListModal()" class="text-gray-400 hover:text-white font-bold text-lg">×</button>
            </div>
            
            <div id="user-lists-container" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>

            <div class="border-t border-gray-800 pt-3 flex items-center gap-2">
                <input type="text" id="modal-new-list-input" placeholder="Thêm danh sách đọc mới..." class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-blue-500 flex-1">
                <button onclick="handleCreateNewListFromModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs shadow-lg shadow-blue-600/30 transition">
                    +
                </button>
            </div>
        </div>
    </div>

    <!-- ADMIN LOGIN MODAL -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-xs w-full p-6 shadow-2xl animate-pop-in space-y-4 text-center">
            <div class="w-12 h-12 rounded-2xl bg-blue-600/20 border border-blue-500/30 text-blue-400 text-2xl flex items-center justify-center mx-auto">🔐</div>
            <div>
                <h3 class="text-base font-bold text-gray-100">Xác Thực Quản Trị Viên</h3>
                <p class="text-xs text-gray-400 mt-1">Nhập PIN Admin để quản lý hệ thống (Mặc định: 1234)</p>
            </div>
            <input type="password" id="admin-pin-input" maxlength="6" placeholder="Nhập PIN..." class="w-full text-center tracking-widest text-lg font-bold bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 focus:border-blue-500 focus:outline-none">
            <div class="flex gap-2">
                <button onclick="closeAdminLoginModal()" class="flex-1 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-300">Hủy</button>
                <button onclick="submitAdminLogin()" class="flex-1 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white shadow-lg shadow-blue-600/30">Mở Khóa</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM ADD CHAPTER MODAL -->
    <div id="add-chapter-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl animate-pop-in space-y-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="text-base font-bold text-blue-400">➕ Thêm Chương Mới</h3>
                <button onclick="closeAddChapterModal()" class="text-gray-400 hover:text-white font-bold text-lg">×</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold mb-1 text-gray-300">Tiêu đề chương *</label>
                    <input type="text" id="modal-ch-title" placeholder="VD: Chương 3: Trận chiến bắt đầu" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2 text-xs focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold mb-1 text-gray-300">Nội dung chương *</label>
                    <textarea id="modal-ch-content" rows="6" placeholder="Nhập nội dung chương truyện..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2 text-xs focus:border-blue-500 focus:outline-none"></textarea>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeAddChapterModal()" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-300 transition">Hủy</button>
                <button id="save-chapter-btn" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white shadow-lg shadow-blue-600/30 transition">Lưu Chương</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="border-t border-gray-900 bg-gray-950/80 py-6 text-center text-xs text-gray-500">
        <p>© 2026 TruyệnHay Premium Reader. Cloud Realtime Sync & Quản lý truyện thông minh[cite: 1].</p>
    </footer>

    <!-- FIREBASE & APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBs2A6jiHqKte5k4Icv2BE1VuDqCy_p5KM",
            authDomain: "quanly-62fb3.firebaseapp.com",
            projectId: "quanly-62fb3",
            storageBucket: "quanly-62fb3.firebasestorage.app",
            messagingSenderId: "1029268847823",
            appId: "1:1029268847823:web:db0d5abd45ecffa434cbba",
            measurementId: "G-MBVYC0565M"
        };

        const app = initializeApp(firebaseConfig);
        const dbFirestore = getFirestore(app);

        const ADMIN_PIN_CORRECT = '1234';

        window.stories = [];
        window.categories = ['Tiên Hiệp', 'Huyền Huyễn', 'Đô Thị', 'Ngôn Tình', 'Kiếm Hiệp', 'Xuyên Không', 'Trọng Sinh', 'Hệ Thống'];
        
        window.isAdminLoggedIn = false;
        window.activeLibraryFolder = 'Tất cả';
        window.targetStoryForAddList = null;

        window.appSettings = JSON.parse(localStorage.getItem('app_admin_settings') || JSON.stringify({
            siteTitle: 'TruyệnHay',
            heroHeading: 'Đọc Truyện Cloud Realtime Không Giới Hạn[cite: 1]',
            heroSub: 'Đồng bộ thời gian thực đa thiết bị, tự do đăng truyện và tùy chỉnh giao diện đọc sách.',
            primaryFont: 'font-inter'
        }));

        window.appState = {
            currentView: 'home',
            selectedStoryId: null,
            selectedChapterIndex: 0,
            searchQuery: '',
            selectedCategory: 'Tất cả',
            readerFont: 'font-inter',
            readerSize: 18,
            readerTheme: 'reader-theme-dark',
            uploadChapterCount: 1
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = "pointer-events-auto flex items-center gap-2 px-4 py-3 bg-gray-900 border border-gray-700/80 rounded-2xl shadow-2xl text-xs font-semibold text-gray-100 animate-slide-in backdrop-blur-md";
            toast.innerHTML = `<span>${type === 'success' ? '✨' : 'ℹ️'}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.handleAdminNavClick = function() {
            if (window.isAdminLoggedIn) {
                window.router('admin');
            } else {
                document.getElementById('admin-login-modal').classList.remove('hidden');
                document.getElementById('admin-pin-input').value = '';
                document.getElementById('admin-pin-input').focus();
            }
        };

        window.closeAdminLoginModal = function() {
            document.getElementById('admin-login-modal').classList.add('hidden');
        };

        window.submitAdminLogin = function() {
            const pin = document.getElementById('admin-pin-input').value.trim();
            if (pin === ADMIN_PIN_CORRECT) {
                window.isAdminLoggedIn = true;
                window.closeAdminLoginModal();
                window.showToast("Đã đăng nhập quyền Admin!");
                window.router('admin');
            } else {
                window.showToast("Mã PIN không chính xác!", "info");
            }
        };

        window.logoutAdmin = function() {
            window.isAdminLoggedIn = false;
            window.showToast("Đã thoát quyền Admin.");
            window.router('home');
        };

        // --- FIRESTORE SYNC FUNCTIONS ---
        async function saveStoryDB(story) {
            await setDoc(doc(dbFirestore, "stories", String(story.id)), story);
        }

        async function deleteStoryPermanentDB(id) {
            await deleteDoc(doc(dbFirestore, "stories", String(id)));
        }

        window.saveProgress = function(storyId, chapterIdx) {
            const progress = JSON.parse(localStorage.getItem('reading_progress') || '{}');
            progress[storyId] = { chapterIdx, updatedAt: Date.now() };
            localStorage.setItem('reading_progress', JSON.stringify(progress));
        };

        window.getProgress = function(storyId) {
            return (JSON.parse(localStorage.getItem('reading_progress') || '{}'))[storyId] || null;
        };

        window.toggleFavorite = function(storyId) {
            let favs = JSON.parse(localStorage.getItem('favorites') || '[]');
            if (favs.includes(storyId)) {
                favs = favs.filter(id => id !== storyId);
                window.showToast("Đã xóa khỏi Tủ Sách Yêu Thích");
            } else {
                favs.push(storyId);
                window.showToast("Đã thêm vào Tủ Sách Yêu Thích");
            }
            localStorage.setItem('favorites', JSON.stringify(favs));
            window.renderView();
        };

        window.isFavorite = function(storyId) {
            return (JSON.parse(localStorage.getItem('favorites') || '[]')).includes(storyId);
        };

        window.getLibraryFolders = function() {
            return JSON.parse(localStorage.getItem('library_folders') || '["Yêu thích", "HE", "Sủng, ngọt"]');
        };

        window.saveLibraryFolders = function(folders) {
            localStorage.setItem('library_folders', JSON.stringify(folders));
        };

        window.addLibraryFolder = function(folderName) {
            let folders = window.getLibraryFolders();
            if (folderName && !folders.includes(folderName)) {
                folders.push(folderName);
                window.saveLibraryFolders(folders);
                window.showToast(`Đã tạo danh sách đọc "${folderName}"`);
            }
        };

        window.deleteLibraryFolder = function(folderName) {
            window.showCustomModal("Xóa danh sách", `Bạn có muốn xóa danh sách đọc "${folderName}" không?`, () => {
                let folders = window.getLibraryFolders().filter(f => f !== folderName);
                window.saveLibraryFolders(folders);
                window.showToast(`Đã xóa danh sách "${folderName}"`);
                window.renderView();
            });
        };

        window.getStoryListsMap = function() {
            return JSON.parse(localStorage.getItem('story_lists_map') || '{}');
        };

        window.toggleStoryInList = function(storyId, listName) {
            let map = window.getStoryListsMap();
            if (!map[storyId]) map[storyId] = [];
            
            if (map[storyId].includes(listName)) {
                map[storyId] = map[storyId].filter(l => l !== listName);
                window.showToast(`Đã xóa khỏi danh sách "${listName}"`);
            } else {
                map[storyId].push(listName);
                window.showToast(`Đã thêm vào danh sách "${listName}"`);
            }
            localStorage.setItem('story_lists_map', JSON.stringify(map));
            window.renderAddToListModalContent();
        };

        window.removeStoryFromCurrentList = function(storyId, listName) {
            if (listName === 'Tất cả') {
                window.toggleFavorite(storyId);
            } else {
                let map = window.getStoryListsMap();
                if (map[storyId]) {
                    map[storyId] = map[storyId].filter(l => l !== listName);
                    localStorage.setItem('story_lists_map', JSON.stringify(map));
                    window.showToast(`Đã xóa khỏi danh sách "${listName}"`);
                    window.renderView();
                }
            }
        };

        window.toggleStoryMenuOptions = function(storyId, e) {
            e.stopPropagation();
            const menu = document.getElementById(`story-option-menu-${storyId}`);
            if (menu) {
                const isHidden = menu.classList.contains('hidden');
                document.querySelectorAll('.story-option-popover').forEach(m => m.classList.add('hidden'));
                if (isHidden) menu.classList.remove('hidden');
            }
        };

        window.openAddToListModal = function(storyId) {
            window.targetStoryForAddList = storyId;
            window.renderAddToListModalContent();
            document.getElementById('add-to-list-modal').classList.remove('hidden');
        };

        window.closeAddToListModal = function() {
            document.getElementById('add-to-list-modal').classList.add('hidden');
            window.renderView();
        };

        window.renderAddToListModalContent = function() {
            const container = document.getElementById('user-lists-container');
            const folders = window.getLibraryFolders();
            const map = window.getStoryListsMap();
            const currentLists = map[window.targetStoryForAddList] || [];

            container.innerHTML = folders.map(listName => {
                const isChecked = currentLists.includes(listName);
                return `
                    <div onclick="toggleStoryInList('${window.targetStoryForAddList}', '${listName}')" class="flex items-center justify-between p-2.5 bg-gray-950 rounded-xl border border-gray-800 hover:border-blue-500/50 cursor-pointer transition">
                        <span class="text-xs font-semibold text-gray-200">🗂️ ${listName}</span>
                        <span class="text-sm">${isChecked ? '🩵' : '⚪'}</span>
                    </div>
                `;
            }).join('');
        };

        window.handleCreateNewListFromModal = function() {
            const input = document.getElementById('modal-new-list-input');
            const val = input.value.trim();
            if (val) {
                window.addLibraryFolder(val);
                input.value = '';
                window.renderAddToListModalContent();
            } else {
                window.showToast("Vui lòng nhập tên danh sách đọc!", "info");
            }
        };

        window.applyGlobalSettings = function() {
            document.getElementById('app-body').className = `bg-gray-950 text-gray-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white transition-colors ${window.appSettings.primaryFont}`;
            const titleEl = document.getElementById('nav-title');
            if (titleEl) titleEl.innerText = window.appSettings.siteTitle || 'TruyệnHay';

            const adminBtn = document.getElementById('nav-admin-btn');
            if (adminBtn) {
                adminBtn.innerHTML = window.isAdminLoggedIn ? '⚙️ <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-500 rounded-full border-2 border-gray-900"></span>' : '⚙️';
            }
        };

        window.router = async function(view, params = {}) {
            if (view === 'admin' && !window.isAdminLoggedIn) {
                window.handleAdminNavClick();
                return;
            }
            window.appState.currentView = view;
            if (params.id) window.appState.selectedStoryId = params.id;
            if (params.chapter !== undefined) window.appState.selectedChapterIndex = params.chapter;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            await window.renderView();
        };

        window.renderView = async function() {
            window.applyGlobalSettings();
            const viewport = document.getElementById('app-viewport');
            if(!viewport) return;
            viewport.className = "flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 animate-fade-in";
            switch (window.appState.currentView) {
                case 'home': viewport.innerHTML = window.renderHome(); break;
                case 'detail': viewport.innerHTML = window.renderDetail(); break;
                case 'read': viewport.innerHTML = window.renderReader(); break;
                case 'upload': viewport.innerHTML = window.renderUpload(); break;
                case 'library': viewport.innerHTML = window.renderLibrary(); break;
                case 'admin': viewport.innerHTML = window.renderAdmin(); break;
                default: viewport.innerHTML = window.renderHome();
            }
        };

        window.renderHome = function() {
            const activeStories = window.stories.filter(s => !s.isDeleted);
            const filtered = activeStories.filter(s => {
                const matchesCat = window.appState.selectedCategory === 'Tất cả' || (s.categories && s.categories.includes(window.appState.selectedCategory));
                const matchesSearch = s.title.toLowerCase().includes(window.appState.searchQuery.toLowerCase()) || s.author.toLowerCase().includes(window.appState.searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            return `
                <div class="space-y-8">
                    <!-- Hero Banner -->
                    <div class="relative rounded-3xl bg-gradient-to-r from-blue-900/60 via-indigo-900/40 to-purple-900/40 p-6 sm:p-10 border border-blue-500/20 shadow-2xl overflow-hidden backdrop-blur-xl">
                        <div class="relative z-10 max-w-2xl space-y-3">
                            <span class="px-3 py-1 bg-blue-500/20 border border-blue-400/30 text-blue-300 text-xs font-semibold rounded-full">Trải nghiệm Cloud Realtime</span>
                            <h1 class="text-3xl sm:text-4xl font-extrabold text-white leading-tight">${window.appSettings.heroHeading}</h1>
                            <p class="text-sm sm:text-base text-gray-300">${window.appSettings.heroSub}</p>

        window.openAddChapterModal = function(storyId) {
            const modal = document.getElementById('add-chapter-modal');
            document.getElementById('modal-ch-title').value = '';
            document.getElementById('modal-ch-content').value = '';
            modal.classList.remove('hidden');

            document.getElementById('save-chapter-btn').onclick = async () => {
                const title = document.getElementById('modal-ch-title').value.trim();
                const content = document.getElementById('modal-ch-content').value.trim();
                if (!title || !content) {
                    window.showToast("Vui lòng điền đủ tiêu đề và nội dung chương!", "info");
                    return;
                }

                const story = window.stories.find(s => String(s.id) === String(storyId));
                if (story) {
                    if (!story.chapters) story.chapters = [];
                    story.chapters.push({ title, content });
                    await saveStoryDB(story);
                    window.closeAddChapterModal();
                    window.showToast("Đã thêm chương mới lên cloud thành công!");
                }
            };
        };

        window.closeAddChapterModal = function() {

                    </div>

            `;
        };

        window.handleUploadSubmit = async function(e) {
            e.preventDefault();
            const title = document.getElementById('up-title').value.trim();
            const author = document.getElementById('up-author').value.trim() || 'Ẩn danh';
            const cover = document.getElementById('up-cover').value.trim();
            const desc = document.getElementById('up-desc').value.trim();

            const checkedCats = Array.from(document.querySelectorAll('input[name="up-categories"]:checked')).map(el => el.value);
            const customTags = document.getElementById('up-tags').value.split(',').map(t => t.trim()).filter(t => t);

            const chapterItems = document.querySelectorAll('.upload-chapter-item');
            const chapters = [];
            chapterItems.forEach((item, idx) => {
                const chTitle = item.querySelector('.up-ch-title').value.trim() || `Chương ${idx + 1}`;
                const chContent = item.querySelector('.up-ch-content').value.trim();
                if (chContent) chapters.push({ title: chTitle, content: chContent });
            });

            if (chapters.length === 0) {
                window.showToast("Vui lòng nhập ít nhất một chương truyện!", "info");
                return;
            }

            const newStory = {
                id: 'story-' + Date.now(),
                title, author, cover, description: desc,
                categories: checkedCats, tags: customTags, isDeleted: false,
                chapters: chapters
            };

            await saveStoryDB(newStory);
            window.showToast("Đã đăng truyện lên cloud thành công!");
            window.router('detail', { id: newStory.id });
        };

        window.renderLibrary = function() {
            const activeStories = window.stories.filter(s => !s.isDeleted);
            const favIds = JSON.parse(localStorage.getItem('favorites') || '[]');
            const folders = window.getLibraryFolders();
            const map = window.getStoryListsMap();

            let filteredStories = activeStories.filter(s => favIds.includes(s.id));
            if (window.activeLibraryFolder !== 'Tất cả') {
                filteredStories = activeStories.filter(s => {
                    const userLists = map[s.id] || [];
                    return userLists.includes(window.activeLibraryFolder);
                });
            }

            return `
                <div class="space-y-6" onclick="document.querySelectorAll('.story-option-popover').forEach(m => m.classList.add('hidden'))">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-gray-800 pb-4">
                        <h1 class="text-2xl font-bold flex items-center gap-2"><span>📚</span> Tủ Sách & Danh Sách Đọc (${filteredStories.length})</h1>
                        
                        <div class="flex items-center gap-2 w-full md:w-auto">
                            <input type="text" id="new-folder-input" placeholder="Thêm danh sách đọc mới..." class="bg-gray-900 border border-gray-700/80 rounded-xl px-3.5 py-2 text-xs text-gray-200 focus:outline-none focus:border-blue-500 flex-1 md:w-60">
                            <button onclick="handleAddNewFolder()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-xl text-sm shadow-lg shadow-blue-600/30 transition flex items-center justify-center">
                                +
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-2">
                        <button onclick="setLibraryFolder('Tất cả')" class="px-4 py-2 rounded-xl text-xs font-semibold transition ${window.activeLibraryFolder === 'Tất cả' ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-900 text-gray-300 hover:bg-gray-800 border border-gray-800'}">Tất cả yêu thích (${activeStories.filter(s => favIds.includes(s.id)).length})</button>
                        ${folders.map(folder => `
                            <div class="flex items-center gap-1 px-3 py-1.5 bg-gray-900 border border-gray-800 rounded-xl text-xs font-medium text-gray-300">
                                <span onclick="setLibraryFolder('${folder}')" class="cursor-pointer hover:text-blue-400 ${window.activeLibraryFolder === folder ? 'text-blue-400 font-bold' : ''}">🗂️ ${folder}</span>
                                <button onclick="deleteLibraryFolder('${folder}')" class="text-red-400 hover:text-red-300 ml-1 font-bold">×</button>
                            </div>
                        `).join('')}
                    </div>

                    ${filteredStories.length === 0 ? `<div class="text-center py-16 bg-gray-900/50 rounded-2xl border border-gray-800"><p class="text-gray-400 text-sm">Chưa có truyện trong danh sách đọc này.</p></div>` : `
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                            ${filteredStories.map(story => `
                                <div class="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 shadow-lg hover:shadow-2xl transition flex flex-col group cursor-pointer relative" onclick="router('detail', {id: '${story.id}'})">
                                    <div class="aspect-[3/4] bg-gray-950 relative">
                                        <img src="${story.cover || 'https://via.placeholder.com/300x400'}" class="w-full h-full object-cover">
                                        
                                        <button onclick="toggleStoryMenuOptions('${story.id}', event)" class="absolute top-2.5 left-2.5 w-8 h-8 rounded-full bg-gray-950/80 backdrop-blur-md flex items-center justify-center text-gray-200 hover:text-white font-bold text-base shadow-md hover:scale-110 transition z-10" title="Tùy chọn">
                                            ⋮
                                        </button>

                                        <div id="story-option-menu-${story.id}" class="story-option-popover hidden absolute top-12 left-2.5 w-48 bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl z-30 p-1.5 space-y-1 text-xs" onclick="event.stopPropagation()">
                                            <button onclick="removeStoryFromCurrentList('${story.id}', '${window.activeLibraryFolder}')" class="w-full text-left px-3 py-2 hover:bg-red-950/40 text-red-400 rounded-xl font-semibold transition flex items-center gap-2">
                                                <span>❌</span> Xóa khỏi danh sách này
                                            </button>
                                            <button onclick="openAddToListModal('${story.id}')" class="w-full text-left px-3 py-2 hover:bg-gray-800 text-gray-200 rounded-xl font-medium transition flex items-center gap-2">
                                                <span>⚙️</span> Quản lý danh sách đọc
                                            </button>
                                        </div>

                                        <button onclick="event.stopPropagation(); toggleFavorite('${story.id}')" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-gray-950/70 flex items-center justify-center text-sm shadow-md">❤️</button>
                                    </div>
                                    <div class="p-3.5">
                                        <h3 class="font-bold text-sm line-clamp-1">${story.title}</h3>
                                        <p class="text-xs text-gray-400 mt-1">${story.author}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        };

        window.handleAddNewFolder = function() {
            const input = document.getElementById('new-folder-input');
            const val = input.value.trim();
            if (val) {
                window.addLibraryFolder(val);
                input.value = '';
            } else {
                window.showToast("Vui lòng nhập tên danh sách đọc!", "info");
            }
        };

        window.setLibraryFolder = function(folderName) {
            window.activeLibraryFolder = folderName;
            window.renderView();
        };

        window.renderAdmin = function() {
            const activeStories = window.stories.filter(s => !s.isDeleted);
            const deletedStories = window.stories.filter(s => s.isDeleted);

            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                        <div class="flex items-center gap-3">
                            <h1 class="text-2xl font-bold flex items-center gap-2"><span>⚙️</span> Trang Quản Trị Admin (Cloud)</h1>
                            <span class="text-xs bg-emerald-900/40 text-emerald-300 border border-emerald-500/30 px-3 py-0.5 rounded-full font-semibold">Đã đăng nhập</span>
                        </div>
                        <button onclick="logoutAdmin()" class="px-3.5 py-1.5 bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-800/40 rounded-xl text-xs font-semibold transition">Đăng Xuất Admin</button>
                    </div>

                    <!-- Custom UI Section -->
                    <div class="bg-gray-900/90 rounded-3xl p-6 border border-gray-800 space-y-4">
                        <h2 class="font-bold text-base text-blue-400 flex items-center gap-2"><span>🎨</span> Tùy Chỉnh Giao Diện Website</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                            <div>
                                <label class="block font-semibold mb-1 text-gray-300">Tên Website / Thương Hiệu</label>
                                <input type="text" id="setting-site-title" value="${window.appSettings.siteTitle}" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-gray-300">Font Chữ Toàn Trang</label>
                                <select id="setting-site-font" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-gray-200">
                                    <option value="font-inter" ${window.appSettings.primaryFont === 'font-inter' ? 'selected' : ''}>Inter (Hiện đại)</option>
                                    <option value="font-lora" ${window.appSettings.primaryFont === 'font-lora' ? 'selected' : ''}>Lora (Thơ mộng)</option>
                                    <option value="font-merriweather" ${window.appSettings.primaryFont === 'font-merriweather' ? 'selected' : ''}>Merriweather (Cổ điển)</option>
                                    <option value="font-mono" ${window.appSettings.primaryFont === 'font-mono' ? 'selected' : ''}>Monospace (Lập trình)</option>
                                </select>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block font-semibold mb-1 text-gray-300">Tiêu Đề Banner Trang Chủ</label>
                                <input type="text" id="setting-hero-head" value="${window.appSettings.heroHeading}" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2">
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block font-semibold mb-1 text-gray-300">Mô Tả Phụ Banner</label>
                                <input type="text" id="setting-hero-sub" value="${window.appSettings.heroSub}" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2">
                            </div>
                        </div>
                        <button onclick="saveAdminThemeSettings()" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-blue-600/20">💾 Lưu Cấu Hình Giao Diện</button>
                    </div>

                    <div class="bg-gray-900/90 rounded-2xl p-6 border border-gray-800 space-y-4">
                        <h2 class="font-bold text-base text-red-400">🗑️ Thùng Rác - Truyện Đã Xóa (${deletedStories.length})</h2>
                        ${deletedStories.length === 0 ? `<p class="text-xs text-gray-500 italic">Thùng rác trống.</p>` : `
                            <div class="divide-y divide-gray-800">
                                ${deletedStories.map(s => `
                                    <div class="py-3 flex items-center justify-between gap-4">
                                        <div>
                                            <h4 class="font-semibold text-xs sm:text-sm text-gray-200">${s.title}</h4>
                                            <p class="text-[11px] text-gray-400">${s.author} - ${s.chapters ? s.chapters.length : 0} chương</p>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <button onclick="restoreStory('${s.id}')" class="px-3 py-1 bg-emerald-700/80 hover:bg-emerald-600 text-white rounded-lg text-xs font-semibold">Khôi phục</button>
                                            <button onclick="deletePermanent('${s.id}')" class="px-3 py-1 bg-red-800/80 hover:bg-red-700 text-white rounded-lg text-xs font-semibold">Xóa vĩnh viễn</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>

                    <div class="bg-gray-900/90 rounded-2xl p-6 border border-gray-800 space-y-4">
                        <h2 class="font-bold text-base text-gray-200">📖 Truyện Đang Hoạt Động Trên Cloud (${activeStories.length})</h2>
                        <div class="divide-y divide-gray-800 max-h-80 overflow-y-auto">
                            ${activeStories.map(s => `
                                <div class="py-3 flex items-center justify-between gap-4">
                                    <div>
                                        <h4 class="font-semibold text-xs sm:text-sm text-gray-200">${s.title}</h4>
                                        <p class="text-[11px] text-gray-400">${s.author}</p>
                                    </div>
                                    <button onclick="softDeleteStory('${s.id}')" class="px-3 py-1 bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-800/30 rounded-lg text-xs">Bỏ vào thùng rác</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        };

        window.saveAdminThemeSettings = function() {
            window.appSettings.siteTitle = document.getElementById('setting-site-title').value.trim() || 'TruyệnHay';
            window.appSettings.primaryFont = document.getElementById('setting-site-font').value;
            window.appSettings.heroHeading = document.getElementById('setting-hero-head').value.trim();
            window.appSettings.heroSub = document.getElementById('setting-hero-sub').value.trim();

            localStorage.setItem('app_admin_settings', JSON.stringify(window.appSettings));
            window.showToast("Đã lưu cài đặt giao diện thành công!");
            window.renderView();
        };

        window.restoreStory = async function(id) {
            const story = window.stories.find(s => String(s.id) === String(id));
            if (story) {
                story.isDeleted = false;
                await saveStoryDB(story);
                window.showToast("Đã khôi phục truyện!");
            }
        };

        window.deletePermanent = function(id) {
            window.showCustomModal("Xóa vĩnh viễn", "Hành động này sẽ xóa vĩnh viễn truyện khỏi cloud và không thể khôi phục!", async () => {
                await deleteStoryPermanentDB(id);
                window.showToast("Đã xóa vĩnh viễn truyện!");
            });
        };

        window.showCustomModal = function(title, msg, onConfirm) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            modal.classList.remove('hidden');

            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            const cleanup = () => {
                modal.classList.add('hidden');
                confirmBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            confirmBtn.onclick = () => { cleanup(); onConfirm(); };
            cancelBtn.onclick = () => cleanup();
        };

        // --- FIRESTORE REALTIME LISTENER ---
        onSnapshot(collection(dbFirestore, "stories"), (snapshot) => {
            window.stories = [];
            snapshot.forEach((docSnap) => {
                window.stories.push(docSnap.data());
            });

            // Nếu chưa có dữ liệu nào trên cloud, tự động đẩy truyện mẫu lên
            if (window.stories.length === 0) {
                const sampleStory = {
                    id: 'sample-1',
                    title: 'Toàn Trí Độc Giả (Cloud)',
                    author: 'Sing N Song',
                    description: 'Bộ truyện thử nghiệm đồng bộ thời gian thực qua Firebase Firestore.',
                    cover: 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400&q=80',
                    categories: ['Huyền Huyễn', 'Hệ Thống'],
                    tags: ['Action', 'Survival'],
                    isDeleted: false,
                    chapters: [
                        { title: 'Chương 1: Khởi đầu đám mây', content: 'Nội dung đồng bộ thời gian thực thành công!' }
                    ]
                };
                saveStoryDB(sampleStory);
            }

            window.renderView();
        });
    </script>
</body>
</html>
